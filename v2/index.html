<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wochenplaner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#000000" id="themeColor">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../cook.png" type="image/png">
<link rel="apple-touch-icon" href="../cook.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: Mobile = eine Spalte mit Tab-Leiste unten; Desktop (ab 1100px) = Woche | Menüplan-Heatmap | Einkauf nebeneinander.
   Look wie die Enyaq-App: tiefschwarz/graphit, Barlow Condensed für Überschriften und Zahlen. Farbe trägt nur Bedeutung
   (Heatmap, Koch, Ernährung) – die Oberfläche selbst bleibt neutral. */
:root{
  --bg:#f1f5f9; --surface:#ffffff; --surface-2:#e2e8f0; --line:#e2e8f0; --field:#cbd5e1; --ink:#0f172a; --muted:#64748b;
  --inv:#0f172a; --inv-ink:#ffffff; --accent:#059669; --accent-ink:#ffffff; --accent-text:#059669; --danger:#dc2626; --ok:#059669;
  --vegan:#16a34a; --veggie:#ca8a04; --fish:#2563eb; --poultry:#ea580c; --meat:#dc2626; --none:#64748b;
  --heat-s:82%; --heat-l:89%; --heat-a:1; --heat-bs:65%; --heat-bl:58%;
  --top:#f1f5f9; --head-bg:rgba(241,245,249,.85); --bg-grad:none; --seg-on:#ffffff;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --hh:64px; --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#020617; --surface:#0f172a; --surface-2:#1e293b; --line:#1e293b; --field:#334155; --ink:#f1f5f9; --muted:#94a3b8;
  --inv:#f1f5f9; --inv-ink:#0f172a; --accent:#059669; --accent-ink:#ffffff; --accent-text:#34d399; --danger:#f87171; --ok:#34d399;
  --vegan:#4ade80; --veggie:#facc15; --fish:#60a5fa; --poultry:#fb923c; --meat:#f87171; --none:#94a3b8;
  --heat-s:75%; --heat-l:50%; --heat-a:.2; --heat-bs:70%; --heat-bl:55%;
  --top:#000000; --head-bg:rgba(2,6,23,.78); --seg-on:#334155;
  --bg-grad:linear-gradient(180deg,#000 0,#000 40px,#030b24 110px,#061a52 210px,#071a45 290px,#040d2b 400px,#020617 560px);
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#020617; --surface:#0f172a; --surface-2:#1e293b; --line:#1e293b; --field:#334155; --ink:#f1f5f9; --muted:#94a3b8;
  --inv:#f1f5f9; --inv-ink:#0f172a; --accent:#059669; --accent-ink:#ffffff; --accent-text:#34d399; --danger:#f87171; --ok:#34d399;
  --vegan:#4ade80; --veggie:#facc15; --fish:#60a5fa; --poultry:#fb923c; --meat:#f87171; --none:#94a3b8;
  --heat-s:75%; --heat-l:50%; --heat-a:.2; --heat-bs:70%; --heat-bl:55%;
  --top:#000000; --head-bg:rgba(2,6,23,.78); --seg-on:#334155;
  --bg-grad:linear-gradient(180deg,#000 0,#000 40px,#030b24 110px,#061a52 210px,#071a45 290px,#040d2b 400px,#020617 560px);
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg) var(--bg-grad) no-repeat fixed;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--top)}
body.dragging{user-select:none;-webkit-user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:700;letter-spacing:.01em}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}

/* ---------- Login ---------- */
#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding-block:32px}
.login-card{width:100%;max-width:380px;display:grid;gap:18px;text-align:center}
.login-card h1{font-size:44px;line-height:1;text-transform:uppercase;letter-spacing:.04em}
.login-card p{margin:0;color:var(--muted)}
.login-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.login-week span{aspect-ratio:1;border-radius:10px;background:hsl(var(--h) var(--heat-s) var(--heat-l) / var(--heat-a));border:1.5px solid hsl(var(--h) var(--heat-bs) var(--heat-bl));display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:14px}
.login-err{color:var(--danger);font-size:14px}

/* ---------- Kopf ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--head-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:var(--hh)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand h1{font-size:24px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;white-space:nowrap}
.brand .v{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--muted);font-family:var(--font-body)}
.edit-info{border:0;background:none;padding:4px 8px;border-radius:8px;color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit-info:hover{background:var(--surface-2)}
.edit-info .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none}
.weeknav{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.weeknav button{border:0;background:none;height:34px;min-width:34px;border-radius:999px;display:grid;place-items:center}
.weeknav button:hover{background:var(--surface-2)}
.weeknav .kw{padding:0 8px;line-height:1.05;text-align:center}
.weeknav .kw b{font-family:var(--font-display);font-size:18px;font-weight:700;display:block;letter-spacing:.02em}
.weeknav .kw span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg,.btn svg{width:18px;height:18px}
@media (max-width:560px){.brand h1{font-size:19px;letter-spacing:.1em;overflow:hidden;text-overflow:ellipsis}.brand .v{display:none}.edit-info{display:none}.top .gear{display:none}}

#sysBanner{margin-top:12px}
main.layout{padding-block:16px calc(92px + env(safe-area-inset-bottom,0px))}
.col{display:none;flex-direction:column;gap:14px;min-width:0}
.col > *{flex-shrink:0}
body[data-tab="woche"] #col-woche, body[data-tab="menu"] #col-menu, body[data-tab="einkauf"] #col-einkauf, body[data-tab="mehr"] #col-mehr{display:flex}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.col-head h2{font-size:26px;text-transform:uppercase;letter-spacing:.05em;line-height:1;white-space:nowrap;display:flex;align-items:center;gap:6px}
.head-search{flex:1;max-width:340px;height:38px;padding:6px 12px!important;border-radius:999px!important}
.edit-dot{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--field);flex:none;align-self:flex-start;margin-top:2px}
.edit-dot.fresh{background:#ef4444;box-shadow:0 0 6px rgba(239,68,68,.6)}
.ftags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ftag{height:34px;min-width:34px;padding:0 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:17px;line-height:1;display:inline-grid;place-items:center;filter:grayscale(.15)}
.ftag.all{font-size:13px;font-weight:600;padding:0 12px}
.ftag[aria-pressed="true"]{background:var(--inv);color:var(--inv-ink);border-color:var(--inv);filter:none}
.fsep{width:1px;height:22px;background:var(--field);margin:0 2px}
.tag-ico{font-size:18px;line-height:1}
.col-head h2 small{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:6px}

@media (min-width:1100px){
  main.layout{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr) minmax(280px,350px);gap:22px;align-items:start;padding-block:18px 24px}
  body:not([data-tab="mehr"]) #col-woche, body:not([data-tab="mehr"]) #col-menu, body:not([data-tab="mehr"]) #col-einkauf{display:flex}
  body[data-tab="mehr"] main.layout{display:block;max-width:760px}
  .col{position:sticky;top:calc(var(--hh) + 18px);max-height:calc(100vh - var(--hh) - 36px);overflow:auto;scrollbar-width:thin;padding-bottom:8px}
  .tabs{display:none}
  .only-mobile{display:none!important}
}
@media (max-width:1099px){
  .only-desktop{display:none!important}
  :root{--hh:54px;--tabh:62px}
  .top .wrap{padding-block:5px}
  .top{display:none}
  main.layout{padding-block:14px calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px))}
  body[data-tab="woche"] main.layout{padding-bottom:calc(var(--tabh) + 8px + env(safe-area-inset-bottom,0px))}
  body[data-tab="woche"] .days{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 14px - 40px - 14px - var(--tabh) - 10px);height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 14px - 40px - 14px - var(--tabh) - 10px);grid-template-rows:repeat(7,minmax(58px,1fr))}
  body[data-tab="woche"] .days.two{grid-template-rows:repeat(7,minmax(84px,1fr))}
}
@media (min-width:1100px){.only-mobile{display:none!important}}
@media (max-width:380px){.brand h1{font-size:17px;letter-spacing:.07em}.weeknav .kw{padding:0 4px}.col-head h2{font-size:24px}}

/* ---------- Tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent-text)}
.tabs .ico{position:relative;display:inline-flex}
.tabs .badge{position:absolute;top:-5px;right:-9px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#10b981;color:#fff;font-size:10px;line-height:16px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- Bausteine ---------- */
.btn{border:1px solid var(--field);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--danger)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapy{flex-wrap:wrap;overflow:visible}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chips button[aria-pressed="true"]{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.chips button .n{opacity:.6;font-variant-numeric:tabular-nums}
.dd{--c:var(--none);width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.d-vegan{--c:var(--vegan)}.d-veggie{--c:var(--veggie)}.d-fish{--c:var(--fish)}.d-poultry{--c:var(--poultry)}.d-meat{--c:var(--meat)}.d-none{--c:var(--none)}
.chip{--c:var(--none);display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px 2px 7px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag{display:inline-flex;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
input[type=text],input[type=search],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--field);border-radius:10px;padding:9px 11px;min-width:0}
textarea{resize:vertical;min-height:120px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.banner{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{margin:0;flex:1 1 220px}
.banner.warn{border-color:var(--danger)}
.banner.strong{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.banner.strong .btn{background:transparent;color:var(--inv-ink);border-color:color-mix(in srgb,var(--inv-ink) 35%,transparent)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--surface-2);width:36px;height:36px;font-size:18px;font-weight:700}
.stepper output{min-width:46px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- Woche ---------- */
.summary{padding:14px;display:grid;gap:12px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat b{font-family:var(--font-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;display:block;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.dietbar{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:2px}
.dietbar i{display:block;background:var(--c)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.wk-view{overflow:hidden;touch-action:pan-y;margin:-3px;padding:3px}
.wk-track{display:flex;align-items:flex-start;transform:translateX(-100%);will-change:transform}
.wk-track.anim{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.wk-page{flex:0 0 100%;min-width:0;padding:0 3px}
.wk-page[aria-hidden="true"]{pointer-events:none}
.days{display:grid;gap:6px}
.rday{display:grid;grid-template-columns:50px minmax(0,1fr);border-radius:14px;background:var(--surface);border:1.5px solid var(--line);overflow:hidden;min-height:0}
.rday.has-cook{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--surface))}
.rd-date{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;border-right:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.rd-date b{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.04em}
.rd-date small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rday.is-today .rd-date{background:var(--ink);color:var(--bg)}
.rday.is-today .rd-date small{color:var(--bg);opacity:.7}
.rday.is-past{opacity:.6}
.rd-slots{display:flex;flex-direction:column;min-width:0}
.rslot{flex:1;display:flex;align-items:center;gap:8px;padding:4px 8px 4px 10px;min-height:0}
.rslot + .rslot{border-top:1px dashed color-mix(in srgb,var(--ink) 14%,transparent)}
.rslot.picking{outline:2px solid var(--accent-text);outline-offset:-3px;border-radius:12px}
.rmeal{flex:1;min-width:0;border:0;background:none;color:inherit;text-align:left;padding:3px 0;display:flex;flex-direction:column;gap:2px}
.rname{font-weight:700;font-size:15px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.two .rname{-webkit-line-clamp:1}
.rmeta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{--c:var(--muted);width:32px;height:32px;border-radius:50%;border:0;background:var(--c);color:#0b1220;display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none;padding:0}
.av.both{background:conic-gradient(#60a5fa 0 50%,#f472b6 50% 100%)}
.av.none{background:none;border:1.5px dashed var(--field);color:var(--muted)}
.rempty{flex:1;display:flex;gap:6px}
.rempty .btn{flex:1;border-style:dashed;background:none;color:var(--muted);height:36px}
.rempty .btn.dice{flex:none;width:40px;padding:0}
.minikw{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.minikw button{border:0;background:none;min-width:32px;height:30px;border-radius:999px;font-size:16px}
.minikw .kwb{white-space:nowrap;font-family:var(--font-display);font-weight:700;font-size:16px;padding:0 4px}
@media (min-width:700px) and (max-width:1099px){.days{grid-template-columns:1fr 1fr}}
.day{overflow:hidden;min-width:0}
.day.is-today{border-color:var(--ink);border-width:2px}
.day.is-past{opacity:.7}
.day-head{display:flex;align-items:baseline;gap:8px;padding:9px 14px 2px}
.day-head .wd{font-family:var(--font-display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.day-head .dt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:700;color:var(--bg);background:var(--ink);padding:1px 8px;border-radius:999px;margin-left:auto}
.slot{padding:6px 10px 10px}
.slot + .slot{border-top:1px dashed var(--line);padding-top:8px}
.slot-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted);margin:0 4px 4px}
.meal{display:flex;align-items:center;gap:8px;border-radius:11px;padding:4px 4px 4px 10px;border:1.5px solid transparent}
.meal.has-cook{--c:var(--muted);border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.meal-main{flex:1;min-width:0;text-align:left;border:0;background:none;padding:5px 0;display:flex;flex-direction:column;gap:3px}
.meal-name{font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.meal-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cook{--c:var(--muted);border:1.5px solid var(--c);color:var(--ink);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;font-size:12px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.cook .ini{width:22px;height:22px;border-radius:50%;background:var(--c);color:#0b0c10;display:grid;place-items:center;font-size:11px;font-weight:800}
.cook.unset{border-style:dashed;color:var(--muted);padding-left:10px}
.empty-slot{display:flex;gap:6px}
.empty-slot .btn{flex:1;border-style:dashed;background:none;color:var(--muted)}
.empty-slot .btn.dice{flex:none;width:42px;padding:0}
.slot.picking .empty-slot .btn,.slot.picking .meal{border-color:var(--accent-text);border-style:solid;color:var(--ink);background:var(--surface-2)}

/* ---------- Menüplan / Heatmap ---------- */
.assign{position:sticky;top:0;z-index:2}
.tools{display:grid;gap:10px}
.tools-row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tools-row select{height:36px;padding:4px 10px;max-width:60%}
.heat-legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.heat-legend .scale{width:90px;height:8px;border-radius:999px;background:linear-gradient(90deg,hsl(145 var(--heat-bs) var(--heat-bl)),hsl(100 var(--heat-bs) var(--heat-bl)),hsl(55 var(--heat-bs) var(--heat-bl)),hsl(0 var(--heat-bs) var(--heat-bl)))}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.mcard{--h:145;position:relative;text-align:left;border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:76px;justify-content:space-between;
  background:hsl(var(--h) var(--heat-s) var(--heat-l) / var(--heat-a));border:1.5px solid hsl(var(--h) var(--heat-bs) var(--heat-bl));color:var(--ink)}
.mcard:hover{filter:brightness(1.04)}
.mcard .mname{font-weight:700;font-size:14px;line-height:1.25;overflow-wrap:anywhere;padding-right:12px}
.mcard .msub{display:flex;align-items:center;gap:6px;font-size:11.5px;color:color-mix(in srgb,var(--ink) 70%,transparent);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .cnt{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink)}
.mcard .star{position:absolute;top:7px;right:8px;font-size:12px}
.mcard.add{background:none;border-style:dashed;border-color:var(--line);color:var(--muted);align-items:center;justify-content:center;font-weight:600}
.assigning .mcard:not(.add){box-shadow:0 0 0 0 transparent}
.assigning .mcard:not(.add):hover{outline:2px solid var(--ink);outline-offset:1px}

/* ---------- Einkauf ---------- */
.group{overflow:hidden}
.group h3{font-family:var(--font-body);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:10px 14px 6px;font-weight:700;display:flex;justify-content:space-between}
.item{display:flex;align-items:flex-start;gap:12px;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.item input{width:20px;height:20px;accent-color:var(--ink);margin:1px 0 0;flex:none}
.item .txt{flex:1;min-width:0}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums;margin-right:4px}
.item .src{display:block;font-size:12px;color:var(--muted)}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.item .del{border:0;background:none;color:var(--muted);padding:0 4px;font-size:20px;line-height:1}
.add-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}

/* ---------- Mehr ---------- */
.panel{padding:16px;display:grid;gap:14px}
.panel h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.cook-edit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--c)}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink);flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv b{font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums;text-align:right}

/* ---------- Sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sheet-panel{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
@media (min-width:700px){.sheet{align-items:center}.sheet-panel{border-radius:20px;border-bottom:1px solid var(--line);max-height:88%}}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}}
.grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sheet-head h2{font-size:28px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;flex:none;font-size:20px;line-height:1}
.sheet-body{display:grid;gap:14px}
.pick-list{display:grid;gap:6px}
.pick{--h:145;display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;text-align:left;
  background:hsl(var(--h) var(--heat-s) var(--heat-l) / var(--heat-a));border:1.5px solid hsl(var(--h) var(--heat-bs) var(--heat-bl));color:var(--ink)}
.pick .nm{font-weight:700;overflow-wrap:anywhere}
.pick .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:color-mix(in srgb,var(--ink) 70%,transparent);margin-top:3px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.ing-list{list-style:none;margin:0;padding:0}
.ing-list li{display:flex;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.ing-list li:first-child{border-top:0}
.ing-list .amt{min-width:76px;font-weight:700;font-variant-numeric:tabular-nums}
.prep{white-space:pre-wrap;margin:0;line-height:1.6}
.ing-rows{display:grid;gap:8px}
.ing-row{display:grid;grid-template-columns:72px 84px minmax(0,1fr);gap:6px;padding:8px}
.ing-row .cat{grid-column:1 / 3}
.ing-row .rm{justify-self:end;border:0;background:none;color:var(--danger);font-weight:600;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--inv);color:var(--inv-ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:70;max-width:calc(100% - 32px);text-align:center}
@media (min-width:1100px){.toast{bottom:24px}}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   Wochenplaner v2
   Daten liegen im selben Firebase-Projekt wie v1, aber in eigenen
   Collections (v2_*). Die v1-Daten werden nur gelesen (Übernahme).
   ===================================================================== */
const FIREBASE_CONFIG={apiKey:"AIzaSyCdK5VgOqwS2qZCcL0dzjEX6l21YxTkDM8",authDomain:"wochenplan-957ec.firebaseapp.com",projectId:"wochenplan-957ec",storageBucket:"wochenplan-957ec.firebasestorage.app",messagingSenderId:"662198750456",appId:"1:662198750456:web:31d9a7f2f6e21efa7f7f0d"};
const FB_VER='10.7.1';
const COL={recipes:'v2_rezepte',plan:'v2_plan',shop:'v2_einkauf',haushalt:'v2_haushalt',meta:'v2_meta'};
const DEMO_KEY='wp2-demo-data';

const DIETS=[{id:'vegan',label:'Vegan'},{id:'veggie',label:'Vegetarisch'},{id:'fish',label:'Fisch'},{id:'poultry',label:'Geflügel'},{id:'meat',label:'Fleisch'}];
const BASE_TAGS=['Schnell','Aufwändig','Reis','Nudeln','Kartoffel','Milch','Salat','Teiggericht','Suppe','Brot'];
const EXTRA_TAGS=['Meal-Prep','Ofengericht','Low Carb','Für Gäste'];
/* Emojis wie in Version 1 (Fisch/Fleisch/vegetarisch sind in v2 die Ernährungsform) */
const TAG_ICON={'Schnell':'⚡','Aufwändig':'🕰️','Reis':'🍚','Nudeln':'🍝','Kartoffel':'🥔','Milch':'🥛','Salat':'🥗','Teiggericht':'🌾','Suppe':'🍲','Brot':'🍞','Meal-Prep':'📦','Ofengericht':'🔥','Low Carb':'🥑','Für Gäste':'👥'};
const DIET_ICON={vegan:'🌱',veggie:'🥕',fish:'🐟',poultry:'🍗',meat:'🥩','':'❔',none:'❔'};
const tagIcon=t=>TAG_ICON[t]||t.slice(0,2);
const CATS=['Obst & Gemüse','Kühlregal','Fleisch & Fisch','Brot & Backwaren','Vorrat','Gewürze & Öle','Tiefkühl','Getränke','Sonstiges'];
const UNITS=['g','kg','ml','l','Stk','EL','TL','Bund','Dose','Pck','Zehe','Prise','Becher','Scheibe','Glas'];
const SLOT_LABEL={mittag:'Mittag',abend:'Abend'};
const WD=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const COLORS=['#60a5fa','#f472b6','#a78bfa','#fbbf24','#34d399','#fb923c'];
const DEFAULT_SETTINGS={
  cooks:[
    {id:'hendrik',name:'Hendrik',color:'#60a5fa',emails:['junkerhendrik@googlemail.com','jhe3ho@bosch.com']},
    {id:'julia',name:'Julia',color:'#f472b6',emails:['20jbard21@gmail.com']}],
  servings:2, slots:['abend'], hideSmall:true
};
const CAT_GUESS=[
  [/tiefkühl|\btk\b|erbsen/i,'Tiefkühl'],
  [/hähnchen|huhn|hühner|rind|schwein|hack|speck|schinken|lachs|fisch|thunfisch|garnele|wurst|pute|kassler|salami|chorizo|filet/i,'Fleisch & Fisch'],
  [/milch|sahne|butter|käse|joghurt|quark|\beier?\b|eier|feta|parmesan|mozzarella|schmand|crème|creme|tofu|spätzle|gnocchi|frischkäse|halloumi|teig/i,'Kühlregal'],
  [/zwiebel|knoblauch|tomate|paprika|zucchini|möhre|karotte|kartoffel|spinat|salat|gurke|ingwer|limette|zitrone|apfel|brokkoli|lauch|petersilie|koriander|basilikum|schnittlauch|champignon|pilz|avocado|chili|süßkartoffel|aubergine|kohl|sellerie|banane|beere|rucola|frühlingszwiebel|kürbis|mais|bohnen grün/i,'Obst & Gemüse'],
  [/brot|brötchen|tortilla|wrap|baguette|toast|fladen|pita/i,'Brot & Backwaren'],
  [/salz|pfeffer|öl\b|olivenöl|essig|curry|kreuzkümmel|paprikapulver|zimt|kurkuma|garam|sojasauce|senf|oregano|thymian|gewürz|brühe|honig|sirup|ketchup|mayo/i,'Gewürze & Öle'],
  [/nudel|spaghetti|penne|reis|linse|mehl|zucker|kichererbse|bohne|kokosmilch|passata|tomatenmark|couscous|bulgur|haferflocken|dose|lasagne|tortellini|mais/i,'Vorrat'],
  [/wein|bier|saft|wasser/i,'Getränke'],
];

/* ---------- Hilfsfunktionen ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function monday(off=0){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return d}
function isoWeekMonday(y,w){const j4=new Date(y,0,4);const m=addDays(j4,-((j4.getDay()+6)%7));return addDays(m,(w-1)*7)}
function kw(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7)}
const short=d=>d.getDate()+'.'+(d.getMonth()+1)+'.';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clean=o=>JSON.parse(JSON.stringify(o));
function fmt(n){if(!n)return '';const r=Math.round(n*100)/100;return String(r).replace('.',',')}
function parseNum(v){const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0}
function guessCat(name){for(const [re,c] of CAT_GUESS)if(re.test(name||''))return c;return 'Sonstiges'}
function ago(dIso){
  if(!dIso)return '';const days=Math.round((fromIso(iso(new Date()))-fromIso(dIso))/864e5);
  if(days<=0)return 'heute';if(days===1)return 'gestern';if(days<7)return `vor ${days} Tagen`;
  const w=Math.floor(days/7);if(w<9)return `vor ${w} Woche${w>1?'n':''}`;const m=Math.round(days/30.4);return `vor ${m} Monat${m>1?'en':''}`;
}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
const pref={get(k,d){try{const v=localStorage.getItem('wp2-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('wp2-'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- Zustand ---------- */
const S={recipes:{},plan:{},shop:{},haushalt:{},settings:clean(DEFAULT_SETTINGS),lastEdit:null,migration:null};
const UI={tab:pref.get('tab','woche'),weekOff:0,q:'',diet:'all',tags:[],sort:pref.get('sort','name'),heat:'all',
  shopFilter:'all',hideDone:pref.get('hideDone',false),assign:null};
let MODE=null, ME=null, FBX=null, BK=null;
const loaded={};
const wide=()=>matchMedia('(min-width:1100px)').matches;

const cooks=()=>S.settings.cooks||[];
const cookById=id=>cooks().find(c=>c.id===id);
const recipe=id=>S.recipes[id];
const dietOf=id=>DIETS.find(d=>d.id===id);
const dietCls=id=>dietOf(id)?'d-'+id:'d-none';
const dietLabel=id=>dietOf(id)?.label||'Ohne Angabe';
function cookFor(email){if(!email)return null;email=email.toLowerCase();return cooks().find(c=>(c.emails||[]).some(e=>e.toLowerCase()===email))||null}
function nameFor(email){return cookFor(email)?.name||(email?email.split('@')[0]:'Jemand')}
function cookView(id){if(id==='both')return {name:'Zusammen',color:'var(--ink)',ini:'2'};const c=cookById(id);return c?{name:c.name,color:c.color,ini:c.name.slice(0,1).toUpperCase()}:null}
const weekDays=(off=UI.weekOff)=>{const m=monday(off);return [0,1,2,3,4,5,6].map(i=>addDays(m,i))};
const weekKey=()=>iso(monday(UI.weekOff));
function weekEntries(off=UI.weekOff){const out=[];for(const d of weekDays(off)){const day=S.plan[iso(d)]||{};for(const s of S.settings.slots){if(day[s])out.push({date:iso(d),slot:s,...day[s]})}}return out}
function allTags(){const set=new Set(BASE_TAGS);Object.values(S.recipes).forEach(r=>(r.tags||[]).forEach(t=>set.add(t)));return [...set]}

/* ---------- Heatmap ---------- */
function heatData(){
  const today=iso(new Date()),from=UI.heat==='12w'?iso(addDays(new Date(),-84)):'';
  const count={},last={};
  for(const [d,day] of Object.entries(S.plan)){
    for(const e of Object.values(day||{})){
      if(!e||!e.recipeId)continue;
      if(d>=from)count[e.recipeId]=(count[e.recipeId]||0)+1;
      if(d<=today&&(!last[e.recipeId]||d>last[e.recipeId]))last[e.recipeId]=d;
    }
  }
  const vals=Object.keys(S.recipes).map(id=>count[id]||0);
  return {count,last,min:vals.length?Math.min(...vals):0,max:vals.length?Math.max(...vals):0};
}
function hue(c,H){if(!c)return 145;if(H.max===H.min)return 55;return Math.round(100-((c-H.min)/(H.max-H.min))*100)}
function sortRecipes(list,H){
  const s=UI.sort;
  return list.sort((a,b)=>{
    if(s==='selten')return (H.count[a.id]||0)-(H.count[b.id]||0)||a.name.localeCompare(b.name);
    if(s==='oft')return (H.count[b.id]||0)-(H.count[a.id]||0)||a.name.localeCompare(b.name);
    if(s==='lange')return (H.last[a.id]||'').localeCompare(H.last[b.id]||'')||a.name.localeCompare(b.name);
    return a.name.localeCompare(b.name,'de');
  });
}
function matchRecipe(r,q,diet,tags){
  if(diet==='fav'&&!r.fav)return false;
  if(diet==='none'&&dietOf(r.diet))return false;
  if(diet!=='all'&&diet!=='fav'&&diet!=='none'&&r.diet!==diet)return false;
  if(tags.length&&!tags.every(t=>(r.tags||[]).includes(t)))return false;
  if(q){const hay=(r.name+' '+(r.tags||[]).join(' ')+' '+(r.ingredients||[]).map(i=>i.name).join(' ')).toLowerCase();if(!hay.includes(q.toLowerCase()))return false}
  return true;
}

const LocalBK={
  label:'demo',
  async set(){this.save()},async del(){this.save()},
  save(){try{localStorage.setItem(DEMO_KEY,JSON.stringify({recipes:S.recipes,plan:S.plan,shop:S.shop,haushalt:S.haushalt,settings:S.settings}))}catch(e){}}
};
const FireBK={
  label:'cloud',
  set(col,id,data,merge){const {F,db}=FBX;const ref=F.doc(db,col,id);return merge?F.setDoc(ref,clean(data),{merge:true}):F.setDoc(ref,clean(data))},
  del(col,id){const {F,db}=FBX;return F.deleteDoc(F.doc(db,col,id))}
};
let touchT=null;
function commit(p){
  render();
  Promise.resolve(p).then(()=>{
    if(MODE!=='cloud')return;
    clearTimeout(touchT);touchT=setTimeout(()=>{FireBK.set(COL.meta,'lastEdit',{email:ME.email,at:Date.now()}).catch(()=>{})},800);
  }).catch(e=>{console.error(e);toast(e.code==='permission-denied'?'Keine Schreibrechte – Firestore-Regeln prüfen':'Speichern fehlgeschlagen: '+(e.message||e))});
}
const Store={
  saveRecipe(r){r.updatedAt=Date.now();S.recipes[r.id]=r;commit(BK.set(COL.recipes,r.id,r))},
  deleteRecipe(id){
    delete S.recipes[id];
    const ps=[BK.del(COL.recipes,id)];
    for(const [d,day] of Object.entries(S.plan)){let ch=false;for(const s in day)if(day[s]&&day[s].recipeId===id){delete day[s];ch=true}
      if(ch){if(Object.keys(day).length){ps.push(BK.set(COL.plan,d,day))}else{delete S.plan[d];ps.push(BK.del(COL.plan,d))}}}
    commit(Promise.all(ps));
  },
  setSlot(date,slot,val){
    const day={...(S.plan[date]||{})};
    if(val)day[slot]=val;else delete day[slot];
    if(Object.keys(day).length){S.plan[date]=day;commit(BK.set(COL.plan,date,day))}
    else{delete S.plan[date];commit(BK.del(COL.plan,date))}
  },
  shopCheck(week,key,val){const w=S.shop[week]=S.shop[week]||{};w.checked={...(w.checked||{}),[key]:val};commit(BK.set(COL.shop,week,{checked:{[key]:val}},true))},
  addHaushalt(name){const id=uid();S.haushalt[id]={id,name,createdAt:Date.now()};commit(BK.set(COL.haushalt,id,{name,createdAt:Date.now()}))},
  delHaushalt(id){delete S.haushalt[id];commit(BK.del(COL.haushalt,id))},
  saveSettings(){commit(BK.set(COL.meta,'settings',S.settings))},
};

/* ----- Einkauf ----- */
function shoppingItems(){
  const f=UI.shopFilter,map={};
  for(const e of weekEntries()){
    const r=recipe(e.recipeId);if(!r)continue;
    if(f!=='all'&&e.cookId!==f)continue;
    const factor=(e.servings||r.servings||2)/(r.servings||2);
    for(const i of r.ingredients||[]){
      let unit=(i.unit||'').trim(),amt=(i.amount||0)*factor;
      const u=unit.toLowerCase();
      if(S.settings.hideSmall&&((u==='g'&&i.amount>0&&i.amount<=2)||u==='prise'))continue;
      if(u==='kg'){unit='g';amt*=1000}if(u==='l'){unit='ml';amt*=1000}
      const base=i.name.trim().toLowerCase()+'|'+unit.toLowerCase();
      const k=f==='all'?base:r.id+'|'+base;
      if(!map[k])map[k]={key:k,name:i.name.trim(),unit,amount:0,cat:i.cat||guessCat(i.name),src:new Set(),recipe:r};
      map[k].amount+=amt;map[k].src.add(r.name);
    }
  }
  return Object.values(map).map(x=>{if(x.unit==='g'&&x.amount>=1000){x.unit='kg';x.amount/=1000}if(x.unit==='ml'&&x.amount>=1000){x.unit='l';x.amount/=1000}return x});
}

      <p class="hint">Liest Gerichte, Rezepte, Wochenplan und Verbrauchsstoffe aus der alten App und kopiert sie in Version 2. Die alten Daten bleiben unverändert, die alte App läuft normal weiter. Du kannst die Übernahme jederzeit wiederholen, um neue Einträge nachzuholen.</p>
      ${m?`<p class="hint">Zuletzt übernommen: ${new Date(m.at).toLocaleString('de-DE')} von ${esc(nameFor(m.by))} – ${m.stats.recipes} Gerichte, ${m.stats.days} Tage.</p>`:''}
      <div id="migBox"><button class="btn primary" data-act="mig-preview">Vorschau laden</button></div></section>`;
  }else{
    h+=`<section class="card panel"><h2>Daten</h2><p class="hint">Die Übernahme der Daten aus Version 1 ist nach der Google-Anmeldung verfügbar.</p></section>`;
  }
  return h;
}

function suggest(date,slot){
  const H=heatData(),used=new Set(weekEntries().map(e=>e.recipeId));
  const prev=(S.plan[iso(addDays(fromIso(date),-1))]||{})[slot],prevDiet=prev&&recipe(prev.recipeId)?.diet;
  let pool=Object.values(S.recipes).filter(r=>!used.has(r.id)&&(!prevDiet||r.diet!==prevDiet));
  if(!pool.length)pool=Object.values(S.recipes).filter(r=>!used.has(r.id));
  if(!pool.length){toast('Keine passenden Gerichte');return}
  pool.sort((a,b)=>(H.count[a.id]||0)-(H.count[b.id]||0)||(H.last[a.id]||'').localeCompare(H.last[b.id]||''));
  const top=pool.slice(0,Math.min(6,pool.length)),r=top[Math.floor(Math.random()*top.length)];
  assignTo(date,slot,r.id);
}

/* ---------- Übernahme aus Version 1 ---------- */
const V1_TAGS={schnell:'Schnell','aufwändig':'Aufwändig',Reis:'Reis',Nudeln:'Nudeln',Kartoffel:'Kartoffel',Milch:'Milch',Salat:'Salat',Teiggericht:'Teiggericht',Suppe:'Suppe',Brot:'Brot'};
const V1_DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const V1_PLACEHOLDER='Arbeitszeit: XX min | Schwierigkeit: ★☆☆';
function convertV1(L){
  const recipes={},nameIdx={},stats={recipes:0,withIngr:0,noDiet:0,days:0,textDays:0,skipped:0,haushalt:0,unparsed:[]};
  for(const it of L.speisekammer){
    const name=String(it.name||'').trim();if(!name||name==='---')continue;
    const t=Array.isArray(it.tags)?it.tags:[];
    const diet=t.includes('Fleisch')?'meat':t.includes('Fisch')?'fish':t.includes('vegetarisch')?'veggie':'';
    const rz=L.rezepte[it.id]||{};
    let prep=String(rz.zubereitung||'').trim();
    const tm=prep.match(/Arbeitszeit:\s*(\d+)/i);
    if(prep===V1_PLACEHOLDER)prep='';
    const ingredients=(Array.isArray(rz.zutaten)?rz.zutaten:[]).filter(z=>z&&String(z.name||'').trim()).map(z=>({amount:parseNum(z.menge),unit:String(z.einheit||'').trim(),name:String(z.name).trim(),cat:guessCat(String(z.name))}));
    recipes[it.id]={id:it.id,name,diet,tags:t.filter(x=>V1_TAGS[x]).map(x=>V1_TAGS[x]),fav:t.includes('Favorit'),time:tm?parseInt(tm[1]):null,servings:2,ingredients,prep,notes:'',source:'',v1:true,createdAt:Date.now()};
    nameIdx[name.toLowerCase()]=it.id;
    stats.recipes++;if(ingredients.length)stats.withIngr++;if(!diet)stats.noDiet++;
  }
  const days={};
  for(const [k,v] of Object.entries(L.plan||{})){
    const m=k.match(/^(\d{4})-KW(\d{1,2})-(.+)$/);
    if(!m){stats.unparsed.push(k);continue}
    const di=V1_DAYS.indexOf(m[3]);if(di<0){stats.unparsed.push(k);continue}
    const date=iso(addDays(isoWeekMonday(+m[1],+m[2]),di));
    const o=(v&&typeof v==='object')?v:{meal:v};
    const meal=String(o.meal||'').trim();
    let rid=o.mealId&&recipes[o.mealId]?o.mealId:nameIdx[meal.toLowerCase()];
    const cookId=o.chef==='J'?'julia':o.chef==='H'?'hendrik':'';
    if(!rid&&(!meal||meal==='---')){stats.skipped++;continue}
    days[date]={abend:rid?{recipeId:rid,cookId,servings:2}:{text:meal,cookId,servings:2}};
    stats.days++;if(!rid)stats.textDays++;
  }
  const haushalt={};
  for(const x of L.verbrauch){if(x.name){haushalt[x.id]={name:String(x.name),createdAt:x.createdAt||Date.now()};stats.haushalt++}}
  return {recipes,days,haushalt,stats};
}
async function readV1(){
  const {F,db}=FBX;
  const [sk,rz,pl,vb]=await Promise.all([F.getDocs(F.collection(db,'speisekammer')),F.getDocs(F.collection(db,'rezepte')),F.getDoc(F.doc(db,'planung','wochenplan2026')),F.getDocs(F.collection(db,'verbrauchsstoffe'))]);
  const L={speisekammer:[],rezepte:{},plan:pl.exists()?pl.data():{},verbrauch:[]};
  sk.forEach(d=>L.speisekammer.push({id:d.id,...d.data()}));
  rz.forEach(d=>L.rezepte[d.id]=d.data());
  vb.forEach(d=>L.verbrauch.push({id:d.id,...d.data()}));
  return L;
}
let MIG=null;
async function migPreview(){
  const box=$('#migBox');box.innerHTML='<div class="spin" style="margin:10px 0"></div>';
  try{MIG=convertV1(await readV1())}catch(e){box.innerHTML=`<p class="login-err">Lesen fehlgeschlagen: ${esc(e.code||e.message)}</p><button class="btn" data-act="mig-preview">Nochmal</button>`;return}
  const st=MIG.stats,exR=Object.keys(MIG.recipes).filter(id=>S.recipes[id]).length,exD=Object.keys(MIG.days).filter(d=>S.plan[d]).length;
  box.innerHTML=`<div class="kv">
      <span>Gerichte</span><b>${st.recipes}</b>
      <span>davon mit Zutaten</span><b>${st.withIngr}</b>
      <span>ohne Ernährungsangabe</span><b>${st.noDiet}</b>
      <span>geplante Tage</span><b>${st.days}</b>
      <span>davon ohne passendes Gericht</span><b>${st.textDays}</b>
      <span>Verbrauchsstoffe</span><b>${st.haushalt}</b>
    </div>
    ${st.unparsed.length?`<p class="hint">${st.unparsed.length} Einträge mit unbekanntem Format werden übersprungen.</p>`:''}
    ${exR||exD?`<label class="toggle"><span>Was in Version 2 schon existiert behalten (${exR} Gerichte, ${exD} Tage)</span><input type="checkbox" id="migKeep" checked></label>`:''}
    <div class="row"><button class="btn primary" data-act="mig-run">Jetzt übernehmen</button><button class="btn" data-act="mig-preview">Neu laden</button></div>`;
}
async function migRun(){
  if(!MIG)return;
  const keep=$('#migKeep')?$('#migKeep').checked:false,{F,db}=FBX,ops=[];
  for(const [id,r] of Object.entries(MIG.recipes))if(!(keep&&S.recipes[id]))ops.push([COL.recipes,id,r]);
  for(const [d,v] of Object.entries(MIG.days))if(!(keep&&S.plan[d]))ops.push([COL.plan,d,v]);
  for(const [id,x] of Object.entries(MIG.haushalt))if(!(keep&&S.haushalt[id]))ops.push([COL.haushalt,id,x]);
  const box=$('#migBox');box.innerHTML=`<p class="hint">Schreibe ${ops.length} Einträge …</p>`;
  try{
    for(let i=0;i<ops.length;i+=400){const b=F.writeBatch(db);ops.slice(i,i+400).forEach(([c,id,d])=>b.set(F.doc(db,c,id),clean(d)));await b.commit()}
    const meta={at:Date.now(),by:ME.email,stats:{recipes:MIG.stats.recipes,days:MIG.stats.days,written:ops.length}};
    await F.setDoc(F.doc(db,COL.meta,'migration'),meta);
    box.innerHTML=`<p class="hint">Fertig: ${ops.length} Einträge übernommen.${MIG.stats.noDiet?` ${MIG.stats.noDiet} Gerichte haben noch keine Ernährungsangabe – im Menüplan unter „Ohne Angabe“ findest du sie.`:''}</p>`;
    toast('Daten übernommen');
  }catch(e){console.error(e);box.innerHTML=`<p class="login-err">Fehler: ${esc(e.code||e.message)}${e.code==='permission-denied'?' – die Firestore-Regeln erlauben die v2-Collections noch nicht.':''}</p>`}
}

/* ---------- Demo-Daten ---------- */
function demoSeed(){
  const R=(id,name,diet,tags,time,ings,prep)=>({id,name,diet,tags,fav:false,time,servings:2,prep,notes:'',source:'',ingredients:ings.map(([a,u,n])=>({amount:a,unit:u,name:n,cat:guessCat(n)}))});
  const rs=[
    R('d1','Rotes Linsen-Dal','vegan',['Schnell','Reis'],30,[[200,'g','Rote Linsen'],[400,'ml','Kokosmilch'],[1,'Stk','Zwiebel'],[2,'Zehe','Knoblauch'],[1,'Dose','Gehackte Tomaten'],[2,'TL','Garam Masala'],[150,'g','Basmatireis'],[100,'g','Babyspinat']],'Zwiebel, Knoblauch anschwitzen.\nGewürze mitrösten, Linsen, Tomaten und Kokosmilch dazu.\n20 Minuten köcheln, Spinat unterheben.'),
    R('d2','Ofenlachs mit Zitronengemüse','fish',['Ofengericht','Low Carb'],35,[[2,'Stk','Lachsfilet'],[1,'Stk','Zucchini'],[1,'Stk','Paprika rot'],[250,'g','Kirschtomaten'],[1,'Stk','Zitrone'],[2,'EL','Olivenöl']],'Ofen auf 200 °C.\nGemüse aufs Blech, nach 10 Minuten Lachs dazu, 15 Minuten garen.'),
    R('d3','Käsespätzle','veggie',['Teiggericht','Milch'],40,[[500,'g','Spätzle'],[200,'g','Bergkäse'],[3,'Stk','Zwiebel'],[30,'g','Butter']],'Zwiebeln goldbraun braten.\nSpätzle und Käse schichten, kurz in den Ofen.'),
    R('d4','Kichererbsen-Curry','vegan',['Reis','Meal-Prep'],35,[[1,'Dose','Kichererbsen'],[1,'Stk','Süßkartoffel'],[1,'Stk','Brokkoli'],[400,'ml','Kokosmilch'],[2,'EL','Currypaste'],[150,'g','Basmatireis']],''),
    R('d5','Hähnchen-Fajitas','poultry',['Schnell','Brot'],25,[[300,'g','Hähnchenbrust'],[2,'Stk','Paprika'],[1,'Stk','Zwiebel'],[6,'Stk','Tortillas'],[150,'g','Schmand'],[1,'Stk','Avocado']],''),
    R('d6','Shakshuka','veggie',['Schnell'],25,[[4,'Stk','Eier'],[1,'Dose','Gehackte Tomaten'],[1,'Stk','Paprika rot'],[100,'g','Feta'],[1,'Stk','Baguette'],[1,'g','Kreuzkümmel']],''),
    R('d7','Spaghetti Bolognese','meat',['Nudeln','Meal-Prep'],60,[[250,'g','Rinderhack'],[250,'g','Spaghetti'],[1,'Stk','Möhre'],[500,'ml','Passata'],[50,'g','Parmesan']],''),
    R('d8','Kartoffelsuppe','veggie',['Suppe','Kartoffel'],45,[[800,'g','Kartoffeln'],[2,'Stk','Möhre'],[1,'Stk','Lauch'],[1,'l','Gemüsebrühe'],[100,'ml','Sahne']],''),
    R('d9','Flammkuchen','meat',['Teiggericht','Ofengericht'],30,[[1,'Pck','Flammkuchenteig'],[200,'g','Schmand'],[125,'g','Speckwürfel'],[2,'Stk','Zwiebel']],''),
    R('d10','Griechischer Salat','veggie',['Salat','Schnell'],15,[[1,'Stk','Gurke'],[300,'g','Tomaten'],[200,'g','Feta'],[1,'Stk','Rote Zwiebel']],''),
    R('d11','Gemüse-Lasagne','veggie',['Nudeln','Ofengericht','Aufwändig'],80,[[250,'g','Lasagneplatten'],[2,'Stk','Zucchini'],[500,'ml','Passata'],[200,'g','Mozzarella']],''),
    R('d12','Thai-Nudeln mit Tofu','vegan',['Nudeln','Schnell'],25,[[250,'g','Reisnudeln'],[200,'g','Tofu'],[1,'Stk','Paprika'],[3,'EL','Sojasauce']],''),
  ];
  rs[0].fav=true;rs[6].fav=true;
  const recipes={};rs.forEach(r=>recipes[r.id]=r);
  const plan={};let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const weights=[5,1,3,4,2,3,6,1,2,1,0,0];
  const bag=[];weights.forEach((w,i)=>{for(let k=0;k<w;k++)bag.push(rs[i].id)});
  const m=monday(0);
  for(let d=-70;d<7;d++){if(d>=0&&d%3===2)continue;if(rnd()<.2)continue;const date=iso(addDays(m,d));
    plan[date]={abend:{recipeId:bag[Math.floor(rnd()*bag.length)],cookId:rnd()<.45?'hendrik':rnd()<.85?'julia':'both',servings:2}}}
  plan[iso(addDays(m,4))]={abend:{text:'Essen gehen',cookId:'',servings:2}};
  const now=Date.now();
  return {recipes,plan,shop:{},haushalt:{h1:{id:'h1',name:'Spülmaschinentabs',createdAt:now},h2:{id:'h2',name:'Küchenrolle',createdAt:now+1}},settings:clean(DEFAULT_SETTINGS)};
}

/* ---------- Start & Anmeldung ---------- */
function show(which){$('#boot').hidden=true;$('#login').hidden=which!=='login';$('#shell').hidden=which!=='app'}
function startDemo(){
  MODE='demo';BK=LocalBK;ME={email:'demo',name:'Demo'};
  let d=null;try{d=JSON.parse(localStorage.getItem(DEMO_KEY))}catch(e){}
  if(!d||!d.recipes)d=demoSeed();
  Object.assign(S,{recipes:d.recipes,plan:d.plan,shop:d.shop||{},haushalt:d.haushalt||{},settings:{...clean(DEFAULT_SETTINGS),...d.settings}});
  LocalBK.save();show('app');render();
}
async function loadFirebase(){
  const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [A,F,U]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js'),import(base+'firebase-auth.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG);
  let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
  FBX={A,F,U,app,db,auth:U.getAuth(app),unsub:[]};
}
function listenCloud(){
  const {F,db}=FBX,u=FBX.unsub;
  const fail=e=>{console.error(e);const b=$('#sysBanner');b.hidden=false;
    b.innerHTML=e.code==='permission-denied'?`<div class="banner warn"><p><b>Kein Zugriff auf die Daten von Version 2.</b> Die Firestore-Regeln müssen die Collections <code>v2_*</code> für euch freigeben.</p></div>`:`<div class="banner warn"><p>Verbindung gestört: ${esc(e.message)}</p></div>`};
  const coll=(name,fn)=>u.push(F.onSnapshot(F.collection(db,name),s=>{fn(s);loaded[name]=true;render()},fail));
  coll(COL.recipes,s=>{S.recipes={};s.forEach(d=>S.recipes[d.id]={...d.data(),id:d.id})});
  coll(COL.plan,s=>{S.plan={};s.forEach(d=>S.plan[d.id]=d.data())});
  coll(COL.shop,s=>{S.shop={};s.forEach(d=>S.shop[d.id]=d.data())});
  coll(COL.haushalt,s=>{S.haushalt={};s.forEach(d=>S.haushalt[d.id]={...d.data(),id:d.id})});
  u.push(F.onSnapshot(F.collection(db,COL.meta),s=>{s.forEach(d=>{const x=d.data();
    if(d.id==='settings')S.settings={...clean(DEFAULT_SETTINGS),...x};
    if(d.id==='lastEdit')S.lastEdit=x;
    if(d.id==='migration')S.migration=x;});render()},fail));
}
async function login(){
  const {U,auth}=FBX,p=new U.GoogleAuthProvider();
  try{await U.signInWithPopup(auth,p)}
  catch(e){
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code)){await U.signInWithRedirect(auth,p);return}
    if(e.code!=='auth/popup-closed-by-user'){const el=$('#loginErr');el.hidden=false;el.textContent='Anmeldung fehlgeschlagen: '+(e.code||e.message)}
  }
}
async function logout(){
  if(MODE==='cloud'){await FBX.U.signOut(FBX.auth);return}
  MODE=null;if(FBX)show('login');else{show('login');$('#loginErr').hidden=false;$('#loginErr').textContent='Google-Anmeldung funktioniert nur in der veröffentlichten App (GitHub Pages).'}
}
async function boot(){
  applyTheme();
  try{await loadFirebase()}catch(e){console.warn('Firebase nicht erreichbar – Demo-Modus',e);startDemo();return}
  FBX.U.onAuthStateChanged(FBX.auth,user=>{
    FBX.unsub.forEach(f=>f());FBX.unsub=[];
    if(user){MODE='cloud';BK=FireBK;ME={email:user.email,name:user.displayName};
      Object.assign(S,{recipes:{},plan:{},shop:{},haushalt:{},settings:clean(DEFAULT_SETTINGS),lastEdit:null});
      show('app');listenCloud();render();}
    else if(MODE!=='demo'){MODE=null;show('login')}
  });
}
function applyTheme(){
  const t=pref.get('theme','system');
  if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;
  const dark=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
  $('#themeColor').setAttribute('content',dark?'#000000':'#f1f5f9');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);

/* ---------- Wochen-Karussell (Wischen) ---------- */
let drag=null,swallowClick=false;
function slideWeek(dir){
  const t=$('#wkTrack');
  const fin=()=>{if(fin.done)return;fin.done=true;UI.weekOff+=dir;UI.assign=null;render()};
  const visible=t&&t.offsetParent!==null;
  if(!dir||!visible||matchMedia('(prefers-reduced-motion: reduce)').matches){if(dir)fin();else render();return}
  t.classList.add('anim');t.style.transform=`translateX(${-100-dir*100}%)`;
  t.addEventListener('transitionend',fin,{once:true});setTimeout(fin,380);
}
function snapBack(){const t=$('#wkTrack');if(!t)return;t.classList.add('anim');t.style.transform='';t.addEventListener('transitionend',()=>t.classList.remove('anim'),{once:true})}
document.addEventListener('pointerdown',e=>{
  const v=e.target.closest('#wkView');if(!v||(e.pointerType==='mouse'&&e.button!==0))return;
  drag={x:e.clientX,y:e.clientY,dx:0,on:false,id:e.pointerId,w:v.clientWidth};
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){drag.on=true;document.body.classList.add('dragging');try{$('#wkView').setPointerCapture(e.pointerId)}catch(_){}}
    else{if(Math.abs(dy)>10)drag=null;return}
  }
  drag.dx=dx;const t=$('#wkTrack');if(t){t.classList.remove('anim');t.style.transform=`translateX(calc(-100% + ${dx}px))`}
});
function endDrag(){
  if(!drag)return;const d=drag;drag=null;document.body.classList.remove('dragging');
  if(!d.on)return;
  swallowClick=true;setTimeout(()=>swallowClick=false,60);
  const thr=Math.min(70,d.w*.18);
  if(Math.abs(d.dx)>thr)slideWeek(d.dx<0?1:-1);else snapBack();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
document.addEventListener('click',e=>{if(swallowClick){e.stopPropagation();e.preventDefault();swallowClick=false}},true);
document.addEventListener('keydown',e=>{if(e.target.matches&&e.target.matches('input,textarea,select'))return;if(!$('#sheet').hidden)return;if(e.key==='ArrowLeft')slideWeek(-1);if(e.key==='ArrowRight')slideWeek(1)});

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const t=e.target.closest('button[data-tab]');
  if(t){UI.tab=t.dataset.tab;pref.set('tab',UI.tab);UI.assign=null;render();window.scrollTo(0,0);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const {act,date,slot,id,v}=a.dataset;
  switch(act){
    case 'close':closeSheet();break;
    case 'login':login();break;
    case 'demo':startDemo();break;
    case 'logout':logout();break;
    case 'demo-reset':try{localStorage.removeItem(DEMO_KEY)}catch(_){}startDemo();toast('Demo zurückgesetzt');break;
    case 'week':if(a.dataset.d==='0'){UI.weekOff=0;UI.assign=null;render()}else slideWeek(+a.dataset.d);break;
    case 'pick':startPick(date,slot);break;
    case 'cancel-assign':UI.assign=null;render();break;
    case 'suggest':suggest(date,slot);break;
    case 'edit-slot':editSlot(date,slot);break;
    case 'cycle-cook':{const e2=(S.plan[date]||{})[slot];if(!e2)break;const order=[...cooks().map(c=>c.id),'both',''];Store.setSlot(date,slot,{...e2,cookId:order[(order.indexOf(e2.cookId||'')+1)%order.length]});break}
    case 'open-recipe':if(UI.assign){assignTo(UI.assign.date,UI.assign.slot,id)}else openRecipe(id);break;
    case 'new-recipe':editRecipe(null);break;
    case 'edit-recipe':editRecipe(id);break;
    case 'diet':UI.diet=UI.diet===v&&v!=='all'?'all':v;render();break;
    case 'filter-all':UI.diet='all';UI.tags=[];render();break;
    case 'edit-who':{const le=S.lastEdit;if(le){const d=new Date(le.at);toast(`Zuletzt bearbeitet: ${nameFor(le.email)}, ${['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()]} ${pad(d.getHours())}:${pad(d.getMinutes())} Uhr`);pref.set('seenEdit',Date.now());render()}break}
    case 'tag':UI.tags=UI.tags.includes(v)?UI.tags.filter(x=>x!==v):[...UI.tags,v];render();break;
    case 'heat':UI.heat=v;pref.set('heat',v);render();break;
    case 'shop-filter':UI.shopFilter=v;render();break;
    case 'shop-hide':UI.hideDone=!UI.hideDone;pref.set('hideDone',UI.hideDone);render();break;
    case 'shop-copy':copy(shopText(),'Einkaufsliste kopiert');break;
    case 'hh-add':{const i=$('#hhIn');const n=i.value.trim();if(n){Store.addHaushalt(n);setTimeout(()=>$('#hhIn')&&$('#hhIn').focus(),0)}break}
    case 'hh-del':Store.delHaushalt(id);break;
    case 'seen-edit':pref.set('seenEdit',Date.now());render();break;
    case 'cook-color':S.settings.cooks[+a.dataset.i].color=v;Store.saveSettings();break;
    case 'serv':S.settings.servings=Math.max(1,S.settings.servings+ +a.dataset.d);Store.saveSettings();break;
    case 'theme':pref.set('theme',v);applyTheme();render();break;
    case 'mig-preview':migPreview();break;
    case 'mig-run':migRun();break;
  }
});
document.addEventListener('input',e=>{const k=e.target.dataset.input;if(k==='q'){UI.q=e.target.value;render()}});
document.addEventListener('change',e=>{
  const k=e.target.dataset.change;if(!k)return;
  if(k==='sort'){UI.sort=e.target.value;pref.set('sort',UI.sort);render()}
  if(k==='check')Store.shopCheck(weekKey(),e.target.dataset.key,e.target.checked);
  if(k==='cook-name'){S.settings.cooks[+e.target.dataset.i].name=e.target.value.trim()||'Ohne Namen';Store.saveSettings()}
  if(k==='lunch'){S.settings.slots=e.target.checked?['mittag','abend']:['abend'];Store.saveSettings()}
  if(k==='hide-small'){S.settings.hideSmall=e.target.checked;Store.saveSettings()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#sheet').hidden)closeSheet();else if(UI.assign){UI.assign=null;render()}}
  if(e.key==='Enter'&&e.target.id==='hhIn'){const n=e.target.value.trim();if(n){Store.addHaushalt(n);setTimeout(()=>$('#hhIn')&&$('#hhIn').focus(),0)}}
});
function copy(t,msg){
  const fb=()=>openSheet(head('','Zum Kopieren markieren')+`<textarea style="min-height:260px" readonly>${esc(t)}</textarea>`,el=>{const ta=el.querySelector('textarea');ta.focus();ta.select()});
  try{navigator.clipboard.writeText(t).then(()=>toast(msg),fb)}catch(e){fb()}
}

if('serviceWorker' in navigator&&/github\.io$|localhost/.test(location.hostname)){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
boot();
</script>
